name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UsageChecker.csproj -r win-x64
      - name: Publish portable
        run: dotnet publish UsageChecker.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishDir=artifacts/portable/
      - name: Publish lightweight
        run: dotnet publish UsageChecker.csproj -c Release -r win-x64 --self-contained false --no-restore -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:PublishDir=artifacts/lite/
      - name: Name release files
        shell: pwsh
        run: |
          Copy-Item artifacts/portable/AIUsageChecker.exe artifacts/AIUsageChecker-Windows-x64-Portable.exe
          Copy-Item artifacts/lite/AIUsageChecker.exe artifacts/AIUsageChecker-Windows-x64-Lite.exe
          Get-FileHash artifacts/AIUsageChecker-Windows-x64-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/AIUsageChecker-Windows-x64-Portable.exe
            artifacts/AIUsageChecker-Windows-x64-Lite.exe
            artifacts/SHA256SUMS.txt
